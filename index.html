<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оля — sizlar uchun chat</title>
<style>
  :root{
    --bg:#F7F1EC;
    --panel:#FFFFFF;
    --ink:#2C231F;
    --muted:#8A7B72;
    --accent:#B5544A;
    --accent-light:#F1DAD6;
    --mine:#3F5A52;
    --mine-light:#DCEAE4;
    --line:#E7DCD3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    height:100vh;
    display:flex;
    flex-direction:column;
  }
  #gate{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--panel);
    border-radius:20px;
    padding:32px 28px;
    max-width:380px;
    width:100%;
    box-shadow:0 8px 30px rgba(44,35,31,0.08);
  }
  .card h1{
    font-size:22px;
    margin:0 0 4px;
    font-weight:600;
  }
  .card p{
    color:var(--muted);
    font-size:14px;
    margin:0 0 22px;
    line-height:1.5;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
  }
  input[type=text]{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    font-size:15px;
    background:#FBF8F5;
    color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--accent-light); border-color:var(--accent);}
  button{
    cursor:pointer;
    border:none;
    font-family:inherit;
  }
  .btn-primary{
    width:100%;
    padding:12px;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    margin-top:6px;
  }
  .btn-primary:active{transform:scale(0.98);}
  #app{
    display:none;
    flex-direction:column;
    height:100vh;
  }
  header{
    background:var(--panel);
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .room-tag{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:#5EA085;
  }
  header h2{
    font-size:15px;
    margin:0;
    font-weight:600;
  }
  header .sub{
    font-size:12px;
    color:var(--muted);
  }
  #leave{
    background:none;
    color:var(--muted);
    font-size:13px;
    padding:6px 10px;
    border-radius:8px;
  }
  #leave:hover{background:var(--bg);}
  #messages{
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    position:relative;
    background-size:cover;
    background-color:#EDE4DC;
    background-position:center;
    background-repeat:no-repeat;
  }
  #messages > *{
    position:relative;
    z-index:1;
  }

<body>

<div id="gate">
  <div class="card">
    <h1>Оля</h1>
    <p>Faqat ikkovingiz uchun. Xona kodini kiriting — ikkalangiz bir xil kodni yozsangiz, suhbat ulanadi.</p>
    <div class="field">
      <label>Ismingiz</label>
      <input type="text" id="nameInput" placeholder="">
    </div>
    <div class="field">
      <label>Xona kodi (ikkovlaringiz uchun bir xil)</label>
      <input type="text" id="roomInput" placeholder="Masalan: bizniki2026">
    </div>
    <button class="btn-primary" id="joinBtn">Kirish</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="room-tag">
      <div class="dot"></div>
      <div>
        <h2 id="roomTitle">Xona</h2>
        <div class="sub" id="youAre">Siz</div>
      </div>
    </div>
    <button id="leave">Chiqish</button>
  </header>
  <div id="messages" class="has-bg">
    <div id="empty">Hali xabar yo'q. Birinchi bo'lib yozing.</div>
  </div>
  <div class="status" id="status"></div>
  <div id="composer">
    <button class="round-btn" id="imageBtn" title="Rasm yuborish">📷</button>
    <input type="file" id="imageInput" accept="image/*" style="display:none">
    <textarea id="textInput" rows="1" placeholder="Xabar yozing..."></textarea>
    <button class="round-btn" id="recordBtn" title="Ovozli xabar">🎤</button>
    <button class="round-btn" id="sendBtn" title="Yuborish">➤</button>
  </div>
</div>

<script>
let room = null;
let myName = null;
let lastRenderedCount = 0;
let mediaRecorder = null;
let audioChunks = [];
let pollTimer = null;

const gate = document.getElementById('gate');
const app = document.getElementById('app');
const messagesEl = document.getElementById('messages');
const emptyEl = document.getElementById('empty');
const statusEl = document.getElementById('status');

document.getElementById('joinBtn').onclick = () => {
  const name = document.getElementById('nameInput').value.trim();
  const roomCode = document.getElementById('roomInput').value.trim();
  if(!name || !roomCode){
    statusGateWarn();
    return;
  }
  myName = name;
  room = roomCode.toLowerCase().replace(/\s+/g,'');
  gate.style.display = 'none';
  app.style.display = 'flex';
  document.getElementById('roomTitle').textContent = 'Xona: ' + room;
  document.getElementById('youAre').textContent = 'Siz: ' + myName;
  startChat();
};

function statusGateWarn(){
  const p = document.querySelector('.card p');
  p.style.color = '#B5544A';
  p.textContent = "Iltimos, ismingiz va xona kodini kiriting.";
}

document.getElementById('leave').onclick = () => {
  clearInterval(pollTimer);
  location.reload();
};

async function startChat(){
  await loadAndRender(true);
  pollTimer = setInterval(() => loadAndRender(false), 2500);
}

function storageKey(){
  return 'ikki-chat:' + room;
}

async function loadMessages(){
  try{
    const res = await window.storage.get(storageKey(), true);
    if(!res) return [];
    return JSON.parse(res.value);
  }catch(e){
    return [];
  }
}

async function saveMessages(list){
  if(list.length > 150) list = list.slice(list.length - 150);
  try{
    await window.storage.set(storageKey(), JSON.stringify(list), true);
  }catch(e){
    statusEl.textContent = "Xabarni saqlashda xato yuz berdi.";
  }
}

async function loadAndRender(initial){
  const list = await loadMessages();
  if(list.length !== lastRenderedCount || initial){
    render(list);
    lastRenderedCount = list.length;
  }
}

function render(list){
  if(list.length === 0){
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyEl);
    return;
  }
  messagesEl.innerHTML = '';
  list.forEach(m => {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (m.sender === myName ? 'mine' : 'theirs');

    if(m.type === 'text'){
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = m.content;
      row.appendChild(b);
    } else if(m.type === 'image'){
      const img = document.createElement('img');
      img.src = m.content;
      row.appendChild(img);
    } else if(m.type === 'audio'){
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = m.content;
      row.appendChild(audio);
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    const time = new Date(m.time).toLocaleTimeString('uz-UZ', {hour:'2-digit', minute:'2-digit'});
    meta.textContent = (m.sender === myName ? 'Siz' : m.sender) + ' · ' + time;
    row.appendChild(meta);

    messagesEl.appendChild(row);
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage(type, content){
  const list = await loadMessages();
  list.push({
    sender: myName,
    type: type,
    content: content,
    time: Date.now()
  });
  await saveMessages(list);
  await loadAndRender(true);
}

async function translateKazakhToUzbek(text){
  try{
    const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=kk|uz');
    const data = await res.json();
    if(data && data.responseData && data.responseData.translatedText){
      return data.responseData.translatedText;
    }
  }catch(e){}
  return text;
}

function looksKazakh(text){
  const kazakhOnlyLetters = /[әғқңөұүһі]/i;
  return kazakhOnlyLetters.test(text);
}

document.getElementById('sendBtn').onclick = async () => {
  const input = document.getElementById('textInput');
  let text = input.value.trim();
  if(!text) return;
  input.value = '';
  if(looksKazakh(text)){
    statusEl.textContent = "Tarjima qilinmoqda...";
    text = await translateKazakhToUzbek(text);
    statusEl.textContent = "";
  }
  await sendMessage('text', text);
};

document.getElementById('textInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    document.getElementById('sendBtn').click();
  }
});

document.getElementById('imageBtn').onclick = () => {
  document.getElementById('imageInput').click();
};

document.getElementById('imageInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  statusEl.textContent = "Rasm tayyorlanmoqda...";
  const dataUrl = await resizeImage(file, 480, 0.6);
  statusEl.textContent = "";
  if(dataUrl.length > 1500000){
    statusEl.textContent = "Rasm juda katta, boshqasini tanlang.";
    return;
  }
  await sendMessage('image', dataUrl);
  e.target.value = '';
});

function resizeImage(file, maxDim, quality){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = h * (maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = w * (maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('recordBtn').onclick = async () => {
  const btn = document.getElementById('recordBtn');
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      btn.classList.remove('recording');
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, {type:'audio/webm'});
      if(blob.size > 2000000){
        statusEl.textContent = "Ovozli xabar juda uzun, qisqaroq yozing.";
        return;
      }
      const reader = new FileReader();
      reader.onload = async () => {
        await sendMessage('audio', reader.result);
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();
    btn.classList.add('recording');
    statusEl.textContent = "Yozilmoqda... to'xtatish uchun tugmani bosing";
    setTimeout(() => {
      if(mediaRecorder && mediaRecorder.state === 'recording'){
        mediaRecorder.stop();
      }
    }, 60000);
  }catch(err){
    statusEl.textContent = "Mikrofonga ruxsat berilmadi.";
  }
};

mediaRecorder && (mediaRecorder.onstop = () => { statusEl.textContent = ''; });
</script>
